{% extends "base.html" %}
{% load humanize %}
{% block content %}
<h2 class="section-title">Your Orders</h2>
<div class="order-list">
    {% for o in orders %}
    <a class="order-row" href="{% url 'orders:detail' o.pk %}">
        <div class="order-col">
            <div class="order-id">#{{ o.id }}</div>
            <div class="order-date muted">{{ o.created_at|date:"M d, Y" }}</div>
        </div>
        <div class="order-col"><span class="badge {{ o.status }}">{{ o.status|title }}</span></div>
        <div class="order-col order-total">₹{{ o.total|floatformat:0|intcomma }}</div>
    </a>
    {% empty %}
    <p class="muted">No orders yet.</p>
    {% endfor %}
</div>
<style>
    .order-list {
        display: grid;
        gap: 10px;
    }

    .order-row {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        align-items: center;
        gap: 12px;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
    }

    .order-row:hover {
        border-color: var(--primary);
    }

    .order-id {
        font-weight: 700;
    }

    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        font-size: 12px;
    }

    .badge.pending {
        background: rgba(245, 158, 11, 0.1);
        border-color: rgba(245, 158, 11, 0.2);
    }

    .badge.processing {
        background: rgba(59, 130, 246, 0.1);
        border-color: rgba(59, 130, 246, 0.2);
    }

    .badge.completed {
        background: rgba(34, 197, 94, 0.1);
        border-color: rgba(34, 197, 94, 0.2);
    }

    .order-total {
        text-align: right;
        font-weight: 700;
        color: var(--primary);
    }
</style>
{% endblock %}
